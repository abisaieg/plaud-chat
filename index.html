<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis grabaciones</title>
<style>
  :root { color-scheme: dark; --fondo:#0f1012; --panel:#17191d; --borde:#26292f; --texto:#e9eaec; --tenue:#8b9099; --acento:#5b8cff; }
  * { box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--fondo); color:var(--texto); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; height:100dvh; padding-top:env(safe-area-inset-top,0); }
  header { padding:14px 18px; border-bottom:1px solid var(--borde); display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:-.01em; }
  header span { font-size:13px; color:var(--tenue); }
  #hilo { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .msg b { font-weight:600; }
  .msg code { background:#0b0c0e; padding:1px 5px; border-radius:5px; font-size:.92em; }
  .msg { max-width:min(680px,92%); padding:12px 15px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .yo { align-self:flex-end; background:var(--acento); color:#fff; border-bottom-right-radius:4px; }
  .el { align-self:flex-start; background:var(--panel); border:1px solid var(--borde); border-bottom-left-radius:4px; }
  .pensando { color:var(--tenue); font-style:italic; }
  form { display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0)); border-top:1px solid var(--borde); background:var(--fondo); }
  input,textarea { font:inherit; color:var(--texto); background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:11px 14px; width:100%; resize:none; }
  input:focus,textarea:focus { outline:none; border-color:var(--acento); }
  button { font:inherit; font-weight:600; background:var(--acento); color:#fff; border:0; border-radius:12px; padding:0 18px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #pin { position:fixed; inset:0; background:var(--fondo); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; }
  #pin input { width:180px; text-align:center; font-size:26px; letter-spacing:.35em; }
  .aviso { color:#ff8080; font-size:14px; min-height:20px; }
  .vacio { color:var(--tenue); text-align:center; margin:auto; padding:0 24px; max-width:420px; }
</style></head><body>
<div id="pin"><div style="font-size:15px;color:var(--tenue)">Mis grabaciones</div>
  <input id="clave" type="tel" inputmode="numeric" maxlength="6" autofocus>
  <div class="aviso" id="avisoPin"></div></div>

<header><h1>Mis grabaciones</h1><span id="cuantas"></span></header>
<div id="hilo"><div class="vacio">Preguntame lo que quieras sobre tus grabaciones.<br><br>
  «¿Qué quedó pendiente con OCA?» · «¿Qué dije sobre precios de mayoristas?» · «Resumime la reunión de marca»</div></div>
<form id="form"><textarea id="entrada" rows="1" placeholder="Preguntá algo…" autocomplete="off"></textarea>
  <button id="enviar">Ir</button></form>

<script>
const $ = (id) => document.getElementById(id);
// La página es estática (GitHub Pages); la API vive en Supabase.
const BASE = "https://rvzvsgiowecamuwvhevw.supabase.co/functions/v1/plaud-chat";
let pin = localStorage.getItem("plaud_pin") || "";

async function pedir(ruta, cuerpo) {
  const r = await fetch(BASE + ruta, { method:"POST", headers:{ "Content-Type":"application/json", "x-pin":pin }, body:JSON.stringify(cuerpo) });
  if (r.status === 401) { localStorage.removeItem("plaud_pin"); location.reload(); return null; }
  if (!r.ok) throw new Error(await r.text());
  return await r.json();
}

async function entrar(valor) {
  const r = await fetch(BASE + "/estado", { headers:{ "x-pin":valor } });
  if (!r.ok) { $("avisoPin").textContent = "PIN incorrecto"; return false; }
  pin = valor; localStorage.setItem("plaud_pin", valor);
  const d = await r.json();
  $("cuantas").textContent = d.grabaciones + " grabaciones · " + d.horas + " h";
  $("pin").style.display = "none";
  await pintarHistorial();
  return true;
}

$("clave").addEventListener("input", async (e) => {
  const v = e.target.value.trim();
  if (v.length >= 4) { if (!(await entrar(v))) e.target.value = ""; }
});

// Claude contesta en markdown: negritas, viñetas y títulos. Sin esto se ven
// los asteriscos crudos en pantalla.
function comoHtml(t) {
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|\n)#{1,6}\s*(.+)/g, "$1<b>$2</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(^|\n)[-*]\s+/g, "$1• ")
    .replace(/\n/g, "<br>");
}

// Al abrir, la charla sigue donde quedó: el hilo vive en el servidor.
async function pintarHistorial() {
  try {
    const r = await fetch(BASE + "/historial", { headers: { "x-pin": pin } });
    if (!r.ok) return;
    const { mensajes } = await r.json();
    for (const m of mensajes) burbuja(m.content, m.role === "user" ? "yo" : "el");
  } catch (e) { /* si falla, se arranca con el hilo vacío */ }
}

function burbuja(texto, quien) {
  const d = document.createElement("div");
  d.className = "msg " + quien;
  if (quien === "yo" || quien.includes("pensando")) d.textContent = texto;
  else d.innerHTML = comoHtml(texto);
  const vacio = document.querySelector(".vacio"); if (vacio) vacio.remove();
  $("hilo").appendChild(d); $("hilo").scrollTop = $("hilo").scrollHeight;
  return d;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const texto = $("entrada").value.trim(); if (!texto) return;
  $("entrada").value = ""; $("entrada").style.height = "auto"; $("enviar").disabled = true;
  burbuja(texto, "yo");
  const esperando = burbuja("buscando en tus grabaciones…", "el pensando");
  try {
    const r = await pedir("/preguntar", { texto });
    if (r) { esperando.className = "msg el"; esperando.innerHTML = comoHtml(r.texto); }
  } catch (err) {
    esperando.className = "msg el"; esperando.textContent = "Se me cayó algo: " + err.message;
  }
  $("enviar").disabled = false; $("entrada").focus();
});

$("entrada").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("entrada").addEventListener("input", (e) => {
  e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
});

if (pin) entrar(pin); else $("clave").focus();
</script></body></html>
