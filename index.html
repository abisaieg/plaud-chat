<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grabaciones">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono.png">
<title>Mis grabaciones</title>
<style>
  :root {
    color-scheme: dark;
    --fondo:#0f1012; --panel:#17191d; --borde:#26292f; --texto:#e9eaec; --tenue:#8b9099; --acento:#5b8cff;
    --arriba: env(safe-area-inset-top, 0px);
    --abajo: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior-y:none; }
  body {
    margin:0; background:var(--fondo); color:var(--texto);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh; -webkit-text-size-adjust:100%;
  }
  header {
    padding:calc(12px + var(--arriba)) 18px 12px; border-bottom:1px solid var(--borde);
    display:flex; align-items:center; gap:9px; flex:0 0 auto;
  }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw; }
  header span { font-size:13px; color:var(--tenue); }
  header #salir { margin-left:auto; background:none; border:0; color:var(--tenue); font-size:13px; padding:4px 0; }

  #hilo { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:min(680px,90%); padding:11px 14px; border-radius:16px; word-wrap:break-word; overflow-wrap:anywhere; }
  .yo { align-self:flex-end; background:var(--acento); color:#fff; border-bottom-right-radius:5px; }
  .el { align-self:flex-start; background:var(--panel); border:1px solid var(--borde); border-bottom-left-radius:5px; }
  .msg b { font-weight:600; }
  .msg code { background:#0b0c0e; padding:1px 5px; border-radius:5px; font-size:.92em; }
  .pensando { color:var(--tenue); font-style:italic; }
  .vacio { color:var(--tenue); text-align:center; margin:auto; padding:0 20px; max-width:420px; font-size:15px; }
  .vacio i { display:block; margin-top:14px; font-style:normal; font-size:14px; line-height:2; }

  /* Escuchar el momento citado, sin salir del chat */
  .oir {
    display:inline-flex; align-items:center; gap:7px; margin:6px 6px 0 0; padding:7px 13px;
    background:#0b0c0e; border:1px solid var(--borde); border-radius:999px;
    color:var(--acento); font-size:14px; font-weight:500; cursor:pointer; min-height:38px;
  }
  .oir:active { background:#1d2027; }
  audio { width:100%; margin-top:8px; }

  form {
    display:flex; gap:9px; align-items:flex-end; flex:0 0 auto;
    padding:10px 12px calc(10px + var(--abajo)); border-top:1px solid var(--borde); background:var(--fondo);
  }
  textarea {
    font:inherit; font-size:16px; color:var(--texto); background:var(--panel);
    border:1px solid var(--borde); border-radius:20px; padding:10px 15px; width:100%;
    resize:none; max-height:130px; line-height:1.4;
  }
  textarea:focus { outline:none; border-color:var(--acento); }
  button.ir {
    font:inherit; font-weight:600; background:var(--acento); color:#fff; border:0;
    border-radius:50%; width:44px; height:44px; flex:0 0 auto; font-size:18px;
  }
  button.ir:disabled { opacity:.4; }

  /* Menú lateral: los chats y la lista de lo grabado */
  #tapa { position:fixed; inset:0; background:#000a; opacity:0; pointer-events:none; transition:opacity .18s; z-index:8; }
  #tapa.visible { opacity:1; pointer-events:auto; }
  #menu {
    position:fixed; top:0; bottom:0; left:0; width:min(320px,86vw); background:var(--panel);
    border-right:1px solid var(--borde); transform:translateX(-102%); transition:transform .2s ease;
    z-index:9; display:flex; flex-direction:column; padding-top:var(--arriba);
  }
  #menu.abierto { transform:none; }
  #menu h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--tenue); margin:16px 16px 8px; }
  #menu .lista { overflow-y:auto; flex:1; padding-bottom:calc(16px + var(--abajo)); }
  .chat-item, .grab-item {
    display:block; width:100%; text-align:left; background:none; border:0; color:var(--texto);
    padding:11px 16px; font:inherit; font-size:15px; border-bottom:1px solid #1e2126;
  }
  .chat-item.activo { background:#1e2229; box-shadow:inset 3px 0 0 var(--acento); }
  .chat-item small, .grab-item small { display:block; color:var(--tenue); font-size:12px; margin-top:3px; }
  .chat-item .equis { float:right; color:var(--tenue); padding:0 4px; }
  #nuevo { margin:12px 16px 4px; padding:11px; border-radius:12px; background:var(--acento); color:#fff; border:0; font:inherit; font-weight:600; }
  .grab-item b { font-weight:600; display:block; line-height:1.4; }
  .grab-item .badge { color:var(--acento); font-size:12px; }
  .grab-item .sumario { color:var(--tenue); font-size:13px; margin-top:4px; line-height:1.45; }
  header .hamb { background:none; border:0; color:var(--texto); font-size:21px; padding:0; margin:0 4px 0 0; line-height:1; align-self:center; }

  #puerta {
    position:fixed; inset:0; background:var(--fondo); z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px;
  }
  #puerta input {
    width:190px; text-align:center; font-size:28px; letter-spacing:.3em; font-family:inherit;
    color:var(--texto); background:var(--panel); border:1px solid var(--borde); border-radius:14px; padding:12px;
  }
  #puerta input:focus { outline:none; border-color:var(--acento); }
  .aviso { color:#ff8b8b; font-size:14px; min-height:20px; text-align:center; max-width:260px; }
</style></head><body>

<div id="puerta">
  <div style="font-size:15px;color:var(--tenue)">Mis grabaciones</div>
  <input id="clave" type="password" inputmode="numeric" autocomplete="off" maxlength="12" enterkeyhint="go">
  <div class="aviso" id="avisoPuerta"></div>
</div>

<div id="tapa"></div>
<nav id="menu">
  <button id="nuevo">+ Nueva conversación</button>
  <h2>Conversaciones</h2>
  <div class="lista" id="listaChats"></div>
  <h2>Últimas grabaciones</h2>
  <div class="lista" id="listaGrabaciones"></div>
</nav>

<header>
  <button class="hamb" id="abrirMenu" aria-label="Menú">☰</button>
  <h1 id="titulo">Mis grabaciones</h1><span id="cuantas"></span>
  <button id="salir" hidden>salir</button>
</header>

<div id="hilo">
  <div class="vacio">Preguntame lo que quieras sobre tus grabaciones.
    <i>«¿Qué quedó pendiente con Uri?» · «¿Qué dije de los cheques?» · «Repasame la reunión de ayer»</i>
  </div>
</div>

<form id="form">
  <textarea id="entrada" rows="1" placeholder="Preguntá algo…" enterkeyhint="send"></textarea>
  <button class="ir" id="enviar" aria-label="Enviar">↑</button>
</form>

<script>
const $ = (id) => document.getElementById(id);
const BASE = "https://rvzvsgiowecamuwvhevw.supabase.co/functions/v1/plaud-chat";
// El PIN no se guarda en ningún lado: se cambia por un pase firmado que vence.
let pase = localStorage.getItem("plaud_pase") || "";

async function api(ruta, opciones = {}) {
  const r = await fetch(BASE + ruta, {
    ...opciones,
    headers: { "Content-Type": "application/json", "x-pase": pase, ...(opciones.headers || {}) },
  });
  if (r.status === 401) { salir(); return null; }
  if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).error) || ("error " + r.status));
  return await r.json();
}

function salir() {
  localStorage.removeItem("plaud_pase");
  pase = "";
  $("puerta").style.display = "flex";
  $("clave").value = "";
  $("hilo").innerHTML = "";
  $("clave").focus();
}
$("salir").addEventListener("click", salir);

async function entrar(pin) {
  $("avisoPuerta").textContent = "";
  const r = await fetch(BASE + "/entrar", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("avisoPuerta").textContent = d.error || "No pude entrar"; return false; }
  pase = d.pase;
  localStorage.setItem("plaud_pase", pase);
  return await abrir();
}

async function abrir() {
  try {
    const d = await api("/estado");
    if (!d) return false;
    $("cuantas").textContent = d.grabaciones + " grabaciones · " + d.horas + " h";
    $("puerta").style.display = "none";
    $("salir").hidden = false;
    await pintarChats();
    await Promise.all([pintarHistorial(), pintarGrabaciones()]);
    return true;
  } catch { return false; }
}

$("clave").addEventListener("keydown", (e) => { if (e.key === "Enter") probar(); });
$("clave").addEventListener("input", (e) => { if (e.target.value.trim().length >= 4) probar(); });
let probando = false;
async function probar() {
  const v = $("clave").value.trim();
  if (probando || v.length < 4) return;
  probando = true;
  if (!(await entrar(v))) $("clave").value = "";
  probando = false;
}

// Claude contesta en markdown y marca los momentos escuchables como [audio:id@mm:ss].
function comoHtml(t) {
  const esc = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc
    .replace(/\[audio:([\w]+)@(\d+):(\d+)(?::(\d+))?\]/g, (_m, id, a, b, c) => {
      const seg = c ? (+a * 3600 + +b * 60 + +c) : (+a * 60 + +b);
      const reloj = c ? `${a}:${b}:${c}` : `${a}:${b}`;
      return `<button class="oir" data-id="${id}" data-seg="${seg}">▶ escuchar ${reloj}</button>`;
    })
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|\n)#{1,6}\s*(.+)/g, "$1<b>$2</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(^|\n)[-*]\s+/g, "$1• ")
    .replace(/\n/g, "<br>");
}

// Un solo reproductor a la vez: el audio se pide recién cuando lo tocás.
$("hilo").addEventListener("click", async (e) => {
  const boton = e.target.closest(".oir");
  if (!boton) return;
  const previo = boton.parentElement.querySelector("audio");
  if (previo) previo.remove();
  boton.disabled = true;
  const original = boton.textContent;
  boton.textContent = "⏳ buscando el audio…";
  try {
    const d = await api("/audio?id=" + encodeURIComponent(boton.dataset.id));
    if (!d) return;
    const a = document.createElement("audio");
    a.controls = true;
    a.preload = "none";
    a.src = d.url + "#t=" + boton.dataset.seg;
    boton.parentElement.insertBefore(a, boton.nextSibling);
    a.currentTime = Number(boton.dataset.seg);
    a.play().catch(() => {});
    boton.textContent = original;
  } catch (err) {
    boton.textContent = "no pude traer el audio";
  }
  boton.disabled = false;
});

let conversacion = Number(localStorage.getItem("plaud_conv") || 0);

function abrirMenu(si) {
  $("menu").classList.toggle("abierto", si);
  $("tapa").classList.toggle("visible", si);
}
$("abrirMenu").addEventListener("click", () => abrirMenu(true));
$("tapa").addEventListener("click", () => abrirMenu(false));

async function pintarChats() {
  const d = await api("/conversaciones");
  if (!d) return;
  const cont = $("listaChats");
  cont.innerHTML = "";
  if (!d.conversaciones.length) { conversacion = 0; return; }
  if (!conversacion) conversacion = d.conversaciones[0].id;
  for (const c of d.conversaciones) {
    const b = document.createElement("button");
    b.className = "chat-item" + (c.id === conversacion ? " activo" : "");
    const cuando = new Date(c.tocado_at).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" });
    b.innerHTML = `<span class="equis" data-borrar="${c.id}">✕</span>${c.titulo}<small>${cuando}</small>`;
    b.addEventListener("click", async (e) => {
      if (e.target.dataset.borrar) {
        await api("/borrar-conversacion", { method: "POST", body: JSON.stringify({ id: c.id }) });
        if (c.id === conversacion) { conversacion = 0; localStorage.removeItem("plaud_conv"); }
        await pintarChats(); await pintarHistorial();
        return;
      }
      conversacion = c.id;
      localStorage.setItem("plaud_conv", c.id);
      abrirMenu(false);
      await pintarChats(); await pintarHistorial();
    });
    cont.appendChild(b);
  }
  const activa = d.conversaciones.find((c) => c.id === conversacion);
  $("titulo").textContent = activa ? activa.titulo : "Mis grabaciones";
}

$("nuevo").addEventListener("click", async () => {
  const d = await api("/conversaciones", { method: "POST" });
  if (!d) return;
  conversacion = d.id;
  localStorage.setItem("plaud_conv", d.id);
  abrirMenu(false);
  await pintarChats();
  await pintarHistorial();
});

async function pintarGrabaciones() {
  const d = await api("/grabaciones");
  if (!d) return;
  const cont = $("listaGrabaciones");
  cont.innerHTML = "";
  for (const g of d.grabaciones) {
    const b = document.createElement("button");
    b.className = "grab-item";
    // Plaud casi nunca les pone nombre: si no hay, la primera línea del
    // resumen dice mucho más que un "Sin título".
    const propio = g.nombre && !/^\d{4}-\d{2}-\d{2}/.test(g.nombre) ? g.nombre : "";
    const resumen = (g.resumen || "").split("\n").filter(Boolean)[0] || "";
    const titulo = propio || resumen || "Sin título";
    const bajada = propio ? resumen : "";
    b.innerHTML = `<b>${titulo}</b>` +
      `<small>${g.cuando} · ${g.minutos} min` +
      (g.avance ? ` · <span class="badge">${g.avance}</span>` : "") + `</small>` +
      (bajada ? `<div class="sumario">${bajada}</div>` : "");
    b.addEventListener("click", () => {
      abrirMenu(false);
      $("entrada").value = `Contame de la grabación del ${g.cuando}` + (propio ? `, "${propio}"` : "");
      $("form").requestSubmit();
    });
    cont.appendChild(b);
  }
}

async function pintarHistorial() {
  $("hilo").innerHTML = "";
  try {
    const d = await api("/historial?c=" + conversacion);
    if (!d) return;
    if (!d.mensajes.length) {
      $("hilo").innerHTML = '<div class="vacio">Preguntame lo que quieras sobre tus grabaciones.' +
        '<i>«¿Qué quedó pendiente con Uri?» · «¿Qué dije de los cheques?» · «Repasame la reunión de ayer»</i></div>';
      return;
    }
    for (const m of d.mensajes) burbuja(m.content, m.role === "user" ? "yo" : "el");
  } catch { /* si falla, se arranca con el hilo vacío */ }
}

function burbuja(texto, quien) {
  const d = document.createElement("div");
  d.className = "msg " + quien;
  if (quien === "yo" || quien.includes("pensando")) d.textContent = texto;
  else d.innerHTML = comoHtml(texto);
  const vacio = document.querySelector(".vacio"); if (vacio) vacio.remove();
  $("hilo").appendChild(d);
  $("hilo").scrollTop = $("hilo").scrollHeight;
  return d;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const texto = $("entrada").value.trim(); if (!texto) return;
  $("entrada").value = ""; $("entrada").style.height = "auto"; $("enviar").disabled = true;
  burbuja(texto, "yo");
  const esperando = burbuja("buscando en tus grabaciones…", "el pensando");
  try {
    const r = await api("/preguntar", { method: "POST", body: JSON.stringify({ texto, conversacion }) });
    if (r) {
      esperando.className = "msg el";
      esperando.innerHTML = comoHtml(r.texto);
      if (r.conversacion && r.conversacion !== conversacion) {
        conversacion = r.conversacion;
        localStorage.setItem("plaud_conv", conversacion);
      }
      pintarChats();
    }
  } catch (err) {
    esperando.className = "msg el"; esperando.textContent = "Se me cayó algo: " + err.message;
  }
  $("enviar").disabled = false;
  $("hilo").scrollTop = $("hilo").scrollHeight;
});

$("entrada").addEventListener("keydown", (e) => {
  // En el celular el Enter es para escribir; en la compu, para mandar.
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) {
    e.preventDefault(); $("form").requestSubmit();
  }
});
$("entrada").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 130) + "px";
});
// Con el teclado abierto, iOS achica la ventana: que el hilo siga a la vista.
if (window.visualViewport) {
  visualViewport.addEventListener("resize", () => { $("hilo").scrollTop = $("hilo").scrollHeight; });
}

if (pase) abrir().then((ok) => { if (!ok) salir(); }); else $("clave").focus();
</script></body></html>
